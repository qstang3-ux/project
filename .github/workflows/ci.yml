name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify generated OpenAPI types are committed
        run: git diff --exit-code -- src/api/generated/schema.ts
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DEFAULT_MODEL_CONFIG: fake
      MODEL_SECRET_KEY: ci-model-secret-at-least-32-bytes
      MIGRATION_DATABASE_URL: postgresql+psycopg://migration_owner:migration_owner@127.0.0.1:5432/management_star
      DATABASE_URL: postgresql+psycopg://app_rw:app_rw@127.0.0.1:5432/management_star
      QUERY_DATABASE_URL: postgresql+psycopg://text2sql_ro:text2sql_ro@127.0.0.1:5432/management_star
      TEST_DATABASE_URL: postgresql+psycopg://migration_owner:migration_owner@127.0.0.1:5432/management_star
      TEST_APP_DATABASE_URL: postgresql+psycopg://app_rw:app_rw@127.0.0.1:5432/management_star
      TEST_QUERY_DATABASE_URL: postgresql+psycopg://text2sql_ro:text2sql_ro@127.0.0.1:5432/management_star
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install backend and quality tools
        run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - name: Start isolated pgvector test database
        run: docker compose up -d --wait postgres
      - name: Migrate and seed test database
        run: |
          alembic upgrade head
          python -m app.seed --seed 20260915
          python -m app.seed --verify
          python scripts/build_rag_index.py
      - name: Run full tests and branch coverage
        run: |
          mkdir -p .runtime
          pytest --cov=app --cov-branch --cov-report=term-missing --cov-report=json:.runtime/coverage.json
          python scripts/check_coverage.py .runtime/coverage.json
      - name: Stop isolated test database
        if: always()
        run: docker compose down -v --remove-orphans

  compose:
    name: Container configuration and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate development Compose
        run: docker compose config --quiet
      - name: Prepare non-sensitive CI secret fixtures
        run: |
          mkdir -p secrets
          printf '%s' 'ci-postgres-password' > secrets/postgres_password.txt
          printf '%s' 'ci-app-password' > secrets/app_rw_password.txt
          printf '%s' 'ci-query-password' > secrets/text2sql_ro_password.txt
          printf '%s' 'ci-model-secret-at-least-32-bytes' > secrets/model_secret_key.txt
          cp .env.prod.example .env.prod
      - name: Validate production Compose
        run: docker compose --env-file .env.prod -f docker-compose.prod.yml config --quiet
      - name: Build application images
        run: docker compose build backend frontend
