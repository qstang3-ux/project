[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "management-star-backend"
version = "0.1.0"
description = "Management Star Text2SQL backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.5",
  "cryptography==45.0.7",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "langgraph==1.2.11",
  "langgraph-checkpoint-postgres==3.1.2",
  "pgvector==0.5.0",
  "psycopg[binary]==3.2.10",
  "pydantic==2.11.9",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.43",
  "sqlglot==27.14.0",
  "sentence-transformers==6.0.1",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.18.1",
  "pytest==8.4.2",
  "pytest-cov==6.2.1",
  "ruff==0.13.0",
  "types-PyYAML==6.0.12.20250822",
  "PyYAML==6.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".runtime", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: requires PostgreSQL"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
