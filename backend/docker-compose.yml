services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: management_star
      POSTGRES_USER: migration_owner
      POSTGRES_PASSWORD: migration_owner
    ports:
      - "5432:5432"
    volumes:
      - management-star-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migration_owner -d management_star"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://migration_owner:migration_owner@postgres:5432/management_star
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build: .
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://migration_owner:migration_owner@postgres:5432/management_star
    command: ["python", "-m", "app.seed", "--seed", "20260915"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  rag-index:
    build: .
    environment:
      APP_ENV: demo
      DATABASE_URL: postgresql+psycopg://app_rw:app_rw@postgres:5432/management_star
      DEFAULT_MODEL_CONFIG: real
      RAG_EMBEDDING_MODEL: BAAI/bge-small-zh-v1.5
    command: ["python", "scripts/build_rag_index.py"]
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: "no"

  backend:
    build: .
    environment:
      APP_ENV: demo
      DATABASE_URL: postgresql+psycopg://app_rw:app_rw@postgres:5432/management_star
      QUERY_DATABASE_URL: postgresql+psycopg://text2sql_ro:text2sql_ro@postgres:5432/management_star
      DEFAULT_MODEL_CONFIG: real
      REAL_MODEL_BASE_URL: ${REAL_MODEL_BASE_URL:-}
      REAL_MODEL_API_KEY: ${REAL_MODEL_API_KEY:-}
      REAL_MODEL_NAME: ${REAL_MODEL_NAME:-}
      REAL_MODEL_PROTOCOL: ${REAL_MODEL_PROTOCOL:-responses}
      REAL_MODEL_TIMEOUT_SECONDS: ${REAL_MODEL_TIMEOUT_SECONDS:-60}
    ports:
      - "8000:8000"
    depends_on:
      rag-index:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  management-star-postgres:
